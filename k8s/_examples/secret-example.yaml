apiVersion: v1
kind: Secret
metadata:
  name: pv-insight-backend-secret
  namespace: pv-insight
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: pv-insight
type: Opaque
stringData:
  RDS_JDBC_URL: REPLACE_ME_RDS_JDBC_URL
  RDS_PASSWORD: REPLACE_ME_RDS_PASSWORD
  GOOGLE_CLIENT_SECRET: REPLACE_ME_GOOGLE_CLIENT_SECRET
---
apiVersion: v1
kind: Secret
metadata:
  name: pv-insight-ai-worker-secret
  namespace: pv-insight
  labels:
    app.kubernetes.io/name: ai-worker
    app.kubernetes.io/part-of: pv-insight
type: Opaque
stringData:
  DATABASE_URI: REPLACE_ME_DATABASE_URI
  # If IAM role/instance profile is unavailable, add AWS credentials here instead.
  # AWS_ACCESS_KEY_ID: REPLACE_ME_AWS_ACCESS_KEY_ID
  # AWS_SECRET_ACCESS_KEY: REPLACE_ME_AWS_SECRET_ACCESS_KEY
