apiVersion: apps/v1
kind: Deployment
metadata:
  name: pv-insight-ai-worker
  namespace: pv-insight
  labels:
    app.kubernetes.io/name: ai-worker
    app.kubernetes.io/part-of: pv-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-worker
      app.kubernetes.io/part-of: pv-insight
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-worker
        app.kubernetes.io/part-of: pv-insight
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: ai-worker
          image: example.invalid/pv-insight-ai-worker:replace-me-git-sha
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: pv-insight-ai-worker-config
            - secretRef:
                name: pv-insight-ai-worker-secret
          startupProbe:
            httpGet:
              path: /internal/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /internal/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
