apiVersion: v1
kind: ConfigMap
metadata:
  name: pv-insight-backend-config
  namespace: pv-insight
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: pv-insight
data:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8080"
  FRONTEND_BASE_URL: https://app.example.invalid
  CORS_ALLOWED_ORIGINS: https://app.example.invalid
  OAUTH2_SUCCESS_REDIRECT_URL: https://app.example.invalid/dashboard
  OAUTH2_FAILURE_REDIRECT_URL: https://app.example.invalid/login?error=oauth
  GOOGLE_CLIENT_ID: REPLACE_ME_GOOGLE_CLIENT_ID
  RDS_USERNAME: REPLACE_ME_RDS_USERNAME
  AWS_REGION: REPLACE_ME_AWS_REGION
  S3_BUCKET_NAME: REPLACE_ME_S3_BUCKET_NAME
  S3_PATH_STYLE_ACCESS_ENABLED: "false"
  SQS_QUEUE_URL: https://sqs.REPLACE_ME_AWS_REGION.amazonaws.com/REPLACE_ME_ACCOUNT_ID/REPLACE_ME_SQS_QUEUE_NAME
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pv-insight-ai-worker-config
  namespace: pv-insight
  labels:
    app.kubernetes.io/name: ai-worker
    app.kubernetes.io/part-of: pv-insight
data:
  APP_ENV: prod
  AWS_REGION: REPLACE_ME_AWS_REGION
  SQS_QUEUE_URL: https://sqs.REPLACE_ME_AWS_REGION.amazonaws.com/REPLACE_ME_ACCOUNT_ID/REPLACE_ME_SQS_QUEUE_NAME
  STORAGE_DEFAULT_BUCKET: REPLACE_ME_S3_BUCKET_NAME
  STORAGE_PATH_STYLE_ENABLED: "false"
  RGB_MODEL_MANIFEST_PATH: /models/rgb/model-manifest.yaml
  THERMAL_MODEL_MANIFEST_PATH: /models/thermal/model-manifest.yaml
