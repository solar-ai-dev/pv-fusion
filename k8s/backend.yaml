apiVersion: apps/v1
kind: Deployment
metadata:
  name: pv-insight-backend
  namespace: pv-insight
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: pv-insight
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: pv-insight
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: pv-insight
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: example.invalid/pv-insight-backend:replace-me-git-sha
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: pv-insight-backend-config
            - secretRef:
                name: pv-insight-backend-secret
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: pv-insight-backend
  namespace: pv-insight
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: pv-insight
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: pv-insight
  ports:
    - name: http
      port: 8080
      targetPort: http
