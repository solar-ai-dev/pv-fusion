apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pv-insight
  namespace: pv-insight
  labels:
    app.kubernetes.io/part-of: pv-insight
spec:
  ingressClassName: traefik
  rules:
    - host: app.example.invalid
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pv-insight-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pv-insight-frontend
                port:
                  number: 80
