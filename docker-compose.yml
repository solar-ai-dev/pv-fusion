services:
  postgres:
    image: postgres:16
    container_name: pv-fusion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pv_fusion_local}
      POSTGRES_USER: ${POSTGRES_USER:-pvfusion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pvfusion}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-pvfusion} -d ${POSTGRES_DB:-pv_fusion_local}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
