services:
  postgres:
    image: postgres:16
    container_name: pv-fusion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pv_fusion_local}
      POSTGRES_USER: ${POSTGRES_USER:-pvfusion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-pvfusion} -d ${POSTGRES_DB:-pv_fusion_local}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: pv-fusion-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change_me_minio_root_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio_root_password}
      MINIO_REGION: ${MINIO_REGION:-ap-northeast-2}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    container_name: pv-fusion-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_INTERNAL_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change_me_minio_root_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio_root_password}
      MINIO_BUCKET_NAME: pv-insight-local
    volumes:
      - ./docker/minio/init-buckets.sh:/init/init-buckets.sh:ro
    entrypoint:
      - /bin/sh
      - /init/init-buckets.sh

  localstack:
    image: localstack/localstack:3.5.0
    container_name: pv-fusion-localstack
    restart: unless-stopped
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${SQS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${SQS_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${SQS_SECRET_KEY:-test}
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - "4566:4566"
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:4566/_localstack/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  localstack-init:
    image: localstack/localstack:3.5.0
    container_name: pv-fusion-localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_DEFAULT_REGION: ${SQS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${SQS_ACCESS_KEY:-test}
      AWS_SECRET_ACCESS_KEY: ${SQS_SECRET_KEY:-test}
      LOCALSTACK_ENDPOINT: http://localstack:4566
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-analysis-job-queue}
    volumes:
      - ./docker/localstack/init-sqs.sh:/init/init-sqs.sh:ro
    entrypoint:
      - /bin/sh
      - /init/init-sqs.sh

  frontend:
    profiles:
      - app
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api/v1}
    container_name: pv-fusion-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/health > /dev/null 2>&1 || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    profiles:
      - app
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pv-fusion-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:?MINIO_BUCKET_NAME is required}
      MINIO_REGION: ${MINIO_REGION:?MINIO_REGION is required}
      SQS_ENDPOINT: http://localstack:4566
      SQS_ACCESS_KEY: ${SQS_ACCESS_KEY:?SQS_ACCESS_KEY is required}
      SQS_SECRET_KEY: ${SQS_SECRET_KEY:?SQS_SECRET_KEY is required}
      SQS_REGION: ${SQS_REGION:?SQS_REGION is required}
      SQS_QUEUE_URL: http://localstack:4566/000000000000/${SQS_QUEUE_NAME:-analysis-job-queue}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    healthcheck:
      test:
        - CMD
        - java
        - -cp
        - /opt/healthcheck
        - HttpHealthcheck
        - http://127.0.0.1:8080/actuator/health/readiness
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  ai-worker:
    profiles:
      - app
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: pv-fusion-ai-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: local
      DATABASE_URI: ${AI_WORKER_DATABASE_URI:?AI_WORKER_DATABASE_URI is required}
      AWS_REGION: ${SQS_REGION:?SQS_REGION is required}
      SQS_QUEUE_URL: http://localstack:4566/000000000000/${SQS_QUEUE_NAME:-analysis-job-queue}
      SQS_ENDPOINT_URL: http://localstack:4566
      SQS_ACCESS_KEY: ${SQS_ACCESS_KEY:?SQS_ACCESS_KEY is required}
      SQS_SECRET_KEY: ${SQS_SECRET_KEY:?SQS_SECRET_KEY is required}
      STORAGE_DEFAULT_BUCKET: ${MINIO_BUCKET_NAME:?MINIO_BUCKET_NAME is required}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_REGION: ${MINIO_REGION:?MINIO_REGION is required}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      STORAGE_PATH_STYLE_ENABLED: "true"
      RGB_MODEL_MANIFEST_PATH: /app/models/rgb/model-manifest.dev.yaml
      THERMAL_MODEL_MANIFEST_PATH: /app/models/thermal/model-manifest.dev.yaml
    ports:
      - "127.0.0.1:${AI_WORKER_PORT:-8000}:8000"
    volumes:
      - ${AI_WORKER_MODEL_DIR:-./ai-worker/models}:/app/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import sys, urllib.request; response = urllib.request.urlopen("http://127.0.0.1:8000/internal/health", timeout=3); sys.exit(0 if 200 <= response.status < 300 else 1)
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

volumes:
  postgres_data:
  minio_data:
