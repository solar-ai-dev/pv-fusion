services:
  postgres:
    image: postgres:16
    container_name: pv-fusion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pv_fusion_local}
      POSTGRES_USER: ${POSTGRES_USER:-pvfusion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_postgres_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-pvfusion} -d ${POSTGRES_DB:-pv_fusion_local}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: pv-fusion-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change_me_minio_root_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio_root_password}
      MINIO_REGION: ${MINIO_REGION:-ap-northeast-2}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  minio-init:
    image: minio/mc:latest
    container_name: pv-fusion-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_INTERNAL_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-change_me_minio_root_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio_root_password}
      MINIO_BUCKET_NAME: pv-insight-local
    volumes:
      - ./docker/minio/init-buckets.sh:/init/init-buckets.sh:ro
    entrypoint:
      - /bin/sh
      - /init/init-buckets.sh

volumes:
  postgres_data:
  minio_data:
